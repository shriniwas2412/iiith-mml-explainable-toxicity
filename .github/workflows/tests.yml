name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e . -r requirements.txt
      - run: python -c "import nltk; nltk.download('averaged_perceptron_tagger_eng', quiet=True)"
      - run: pytest -q
